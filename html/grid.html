<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid: Бенто-композиции</title>
    <link rel="stylesheet" href="../css/stylegr.css">
</head>
<body>
    <header class="header">
        <nav class="menu">
            <a href="index.html">Главная</a>
            <a href="index.html#video" class="vid">Видео</a>
            <a href="interes.html" class="int">Мои интересы</a>
            <a href="loli.html" class="valid">Регистрация</a>
        </nav>
    </header>
    
    <h1>Пять бенто-композиций</h1>
    
    <section class="bento bento-5">
        <h2>Вариант 5: Главная плитка и боковые карточки</h2>
        <div class="grid-5">
            <div class="item big"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item wide"></div>
        </div>
    </section>
    
    <section class="bento bento-4">
        <h2>Вариант 4: Боковая колонка</h2>
        <div class="grid-4">
            <div class="item big"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
        </div>
    </section>
    
    <section class="bento bento-3">
        <h2>Вариант 3: Чередование акцента</h2>
        <div class="grid-3">
            <div class="item block-1"></div>
            <div class="item block-2"></div>
            <div class="item block-3"></div>
            <div class="item block-4"></div>
            <div class="item block-5"></div>
            <div class="item block-6"></div>
        </div>
    </section>
    
    <section class="bento bento-2">
        <h2>Вариант 2: Высокая плитка слева</h2>
        <div class="grid-2">
            <div class="item tall"></div>
            <div class="item wide"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item bottom"></div>
        </div>
    </section>
    
    <section class="bento bento-1">
        <h2>Вариант 1: Акцентные строки</h2>
        <div class="grid-1">
            <div class="item"></div>
            <div class="item wide"></div>
            <div class="item wide"></div>
            <div class="item"></div>
            <div class="item bottom"></div>
        </div>
    </section>
</body>
</html>
